name: iOS CI

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-style:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check PR and commit titles
        env:
          HUSKY: '0'
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm ci
          printf '%s\n' "$PR_TITLE" | npm run lint:commit -- --verbose
          npm run lint:commit -- --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  simulator-build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build for iOS Simulator
        run: xcodebuild -project Majung.xcodeproj -scheme Majung -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run unit tests on iOS Simulator
        run: |
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devs=[d for r,ds in data["devices"].items() if "iOS" in r for d in ds if d.get("isAvailable") and "iPhone" in d.get("name","")]; devs.sort(key=lambda d: (d.get("state") != "Booted", "Pro" not in d["name"], d["name"])); print(devs[0]["udid"])')"
          echo "Using simulator: $SIM_ID"
          xcodebuild -project Majung.xcodeproj -scheme Majung -destination "platform=iOS Simulator,id=$SIM_ID" CODE_SIGNING_ALLOWED=NO -only-testing:MajungTests test
